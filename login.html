<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BitWise - Log In</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">


    <style>

        body {
            min-height: 100vh;
            background: #3a1f4d;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
        }

        .auth-card {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5);
        }

        .image-col {
            background: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQdLI0sYNbQOnKGShDeruvqljHGIoN91vnhivU1eDPJBA&s=10')
            center/cover no-repeat;

            min-height: 300px;
        }

        .image-col-overlay {
            background: linear-gradient(
                180deg,
                rgba(30, 10, 40, 0.3),
                rgba(50, 20, 70, 0.6)
            );

            min-height: 300px;
        }

        .left-text {
            color: #fff;
        }

        .left-text h1 {
            font-size: 28px;
            font-weight: 600;
            line-height: 1.3;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
        }

        .form-col {
            background: rgba(60, 30, 80, 0.9);
            color: #fff;
        }

        /* BITWISE */

        .brand .brand-text {
            font-weight: 800;
            font-size: 50px;
            letter-spacing: 1px;
        }

        .brand .brand-text span {
            color: #ff7a45;
        }

        .brand-sub {
            font-size: 15px;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        /* INPUT */

        .glass-input {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #fff;
        }

        .glass-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .glass-input:focus {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.6);
            color: #fff;
            box-shadow: none;
        }

        /* LOGIN BUTTON */

        .btn-create {
            background: #fff;
            color: #3a2a6a;
            border-radius: 25px;
            font-weight: 600;
            padding: 10px;
        }

        .btn-create:hover {
            color: #3a2a6a;
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.35);
        }

    </style>

</head>


<body class="d-flex align-items-center justify-content-center py-4">


    <div class="container">

        <div class="auth-card row g-0 mx-auto"
            style="max-width: 950px;">


            <!--  LEFT IMAGE  -->

            <div class="col-md-6 image-col d-none d-md-block">

                <div class="image-col-overlay h-100 w-100
                            d-flex align-items-end p-4">

                    <div class="left-text">

                        <h1 class="mb-4">

                            Smart budgeting today <br>
                            builds a secure <br>
                            and stress-free tomorrow

                        </h1>

                    </div>

                </div>

            </div>



            <!--  LOGIN FORM -->

            <div class="col-12 col-md-6 form-col
                        p-4 p-md-5
                        d-flex flex-column justify-content-center">


                <!-- BRAND -->

                <div class="brand d-flex align-items-center gap-2 mb-1">

                    <div class="brand-text">

                        Bit<span>Wise</span>

                    </div>

                </div>


                <!-- DESCRIPTION -->

                <div class="brand-sub ms-5 ps-1 mb-4">

                    “Plan your income, track your expenses, and
                    take control of your financial future.”

                </div>



                <h2 class="fw-semibold mb-4">

                    Sign In

                </h2>



                <!--  FORM  -->

                <form id="loginForm">


                    <!-- EMAIL -->

                    <div class="mb-3">

                        <label for="email"
                            class="form-label small opacity-75">

                            E-mail

                        </label>


                        <input type="email"
                            id="email"
                            class="form-control glass-input"
                            placeholder="E-mail Address"
                            autocomplete="email">

                    </div>



                    <!-- PASSWORD -->

                    <div class="mb-3">

                        <label for="password"
                            class="form-label small opacity-75">

                            Password

                        </label>


                        <input type="password"
                            id="password"
                            class="form-control glass-input"
                            placeholder="••••••••••"
                            autocomplete="current-password">

                    </div>



                    <!-- ERROR MESSAGE -->

                    <div id="loginError"
                        class="text-warning small text-center mb-2">

                    </div>



                    <!-- LOGIN BUTTON -->

                    <div class="d-flex justify-content-center">

                        <button type="submit"
                            class="btn btn-create w-50 mt-3">

                            Log In

                        </button>

                    </div>



                    <!-- REGISTER -->

                    <p class="text-center small mt-4 mb-0"
                        style="color: rgba(255,255,255,0.75);">

                        You don't have an account?

                        <a href="register.html"
                            class="fw-semibold text-white text-decoration-none">

                            Register now

                        </a>

                    </p>


                </form>


            </div>

        </div>

    </div>



    <!--  SCRIPT  -->

    <script src="login.js"></script>


</body>

</html>
